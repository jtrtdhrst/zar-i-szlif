<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Szlif, raven NPC mascot, front three-quarter pose">
  <title>Szlif — provisional STYLE_2_V0 master (Engineer fixture, designer review pending)</title>
  <!-- palette: slate #2B2F3E, feather-dark #171A26, amber #E8A33D, cream #F6E7CE -->
  <g id="body">
    <ellipse cx="250" cy="350" rx="100" ry="112" fill="#2B2F3E"/>
    <ellipse cx="250" cy="372" rx="56" ry="70" fill="#171A26"/>
  </g>
  <g id="wing">
    <path d="M165 330 C 130 360 125 415 160 450 C 175 445 195 420 200 380 Z" fill="#171A26"/>
    <path d="M335 330 C 370 360 375 415 340 450 C 325 445 305 420 300 380 Z" fill="#171A26"/>
  </g>
  <g id="head">
    <ellipse cx="250" cy="205" rx="98" ry="88" fill="#2B2F3E"/>
    <!-- distinct head-feather silhouette: three spikes -->
    <polygon points="190,135 175,70 220,115" fill="#171A26"/>
    <polygon points="235,120 240,50 265,118" fill="#171A26"/>
    <polygon points="280,122 310,62 315,130" fill="#171A26"/>
    <!-- beak -->
    <polygon points="250,215 218,248 282,248" fill="#E8A33D"/>
    <polygon points="250,215 236,248 264,248" fill="#171A26" opacity="0.25"/>
  </g>
  <g id="facial-features">
    <ellipse cx="208" cy="198" rx="14" ry="16" fill="#F6E7CE"/>
    <ellipse cx="292" cy="198" rx="14" ry="16" fill="#F6E7CE"/>
    <circle cx="210" cy="200" r="6" fill="#171A26"/>
    <circle cx="290" cy="200" r="6" fill="#171A26"/>
    <!-- subtle ironic brow ticks -->
    <rect x="192" y="172" width="32" height="7" rx="3.5" fill="#171A26" transform="rotate(-8 208 175)"/>
    <rect x="276" y="172" width="32" height="7" rx="3.5" fill="#171A26" transform="rotate(4 292 175)"/>
  </g>
  <g id="accessories">
    <!-- notebook / plan prop -->
    <g transform="rotate(8 330 380)">
      <rect x="296" y="336" width="72" height="92" rx="6" fill="#F6E7CE"/>
      <rect x="296" y="336" width="14" height="92" fill="#E8A33D"/>
      <rect x="318" y="352" width="38" height="6" fill="#2B2F3E"/>
      <rect x="318" y="366" width="38" height="6" fill="#2B2F3E"/>
      <rect x="318" y="380" width="26" height="6" fill="#2B2F3E"/>
    </g>
  </g>
</svg>
