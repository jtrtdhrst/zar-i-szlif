  <path id="szlif-b-leg-tucked" fill="#E2A03F" d="M 236 396 C 244 404 258 408 268 404 C 276 400 274 390 266 388 C 256 386 242 386 234 390 Z"/>
  <!-- LEG / planted leg -->
  <path id="szlif-b-leg" fill="#E2A03F" d="M 262 384 L 278 382 L 280 424 L 284 452 L 272 456 L 266 424 Z"/>
  <!-- FEET / splayed toes -->
  <path id="szlif-b-feet" fill="#E2A03F" d="M 264 444 L 278 444 L 280 453 L 302 458 L 299 467 L 284 462 L 292 474 L 284 479 L 274 466 L 262 476 L 255 472 L 259 462 L 247 464 L 244 457 L 260 453 Z"/>
