  <!-- HEAD / large heavy head tilted down -->
  <path id="szlif-b-head" fill="#232833" d="M 344 148 L 316 128 L 276 130 L 250 152 L 244 186 L 258 216 L 292 232 L 330 228 L 352 202 L 358 172 Z"/>
  <!-- THROAT / shaggy throat hackles -->
  <path id="szlif-b-hackle" fill="#232833" d="M 262 210 L 330 218 L 326 242 L 316 274 L 302 242 L 288 278 L 278 240 L 260 252 Z"/>
