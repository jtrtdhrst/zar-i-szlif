<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Szlif direction B — perched thinker</title>
  <desc id="desc">Szlif the raven, direction B: soft rounded construction. A hunched perched raven with a large heavy head tilted down over an open notebook, a shorter deep hooked ochre bill, two broad soft crest feathers laid back, a shaggy throat, a folded wing with three visible primary tips, a wide low fanned tail resting on the ground, one foot planted forward and one leg tucked, reading his plan in a talon.</desc>

  <!-- CREST / broad soft feather laid back -->
  <path id="szlif-b-crest-1" fill="#46536A" d="M 288 132 C 268 116 240 106 214 106 C 202 106 198 116 206 124 C 220 138 248 148 274 150 Z"/>
  <!-- CREST / broad soft feather laid back -->
  <path id="szlif-b-crest-2" fill="#46536A" d="M 276 152 C 258 140 234 132 212 134 C 200 135 197 145 205 152 C 219 163 244 168 266 168 Z"/>
  <!-- TAIL / wide low fan resting on the ground -->
