  <path id="iskra-a-arm" fill="#E2702D" d="M 276 250 C 272 276 254 296 232 308 C 214 318 196 326 180 330 C 166 334 152 326 148 314 C 144 302 152 288 166 286 C 180 284 194 288 208 284 C 226 279 242 266 252 250 C 258 240 272 236 276 250 Z"/>
  <!-- PAW / cream mitten gripping the plan sheet -->
