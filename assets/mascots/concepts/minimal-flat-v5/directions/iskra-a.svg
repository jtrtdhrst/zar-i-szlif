<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Iskra direction A — workshop sitter</title>
  <desc id="desc">Iskra the fox, direction A: soft-round construction. Upright seated fox with a tapered torso, a separate hind haunch, a planted foreleg and a raised foreleg holding a turquoise plan sheet, a narrow projecting muzzle, tall pointed ears, a rust lock of hair sweeping across the far eye, a swept cowlick, and a turquoise scarf wrapped round the neck with a knot and a flying end.</desc>

  <!-- TAIL / broad plume sweeping up-right from the haunch -->
  <path id="iskra-a-tail" fill="#E2702D" d="M 318 402 C 342 382 372 354 396 324 C 418 296 434 266 442 236 C 450 208 452 180 444 162 C 436 144 418 142 408 154 C 398 166 396 186 388 208 C 378 236 360 260 340 284 C 318 310 300 338 294 366 C 288 392 296 414 318 402 Z"/>
  <!-- TAIL / cream tip -->
  <path id="iskra-a-tail-tip" fill="#F7E8D3" d="M 444 162 C 436 144 418 142 408 154 C 398 166 394 186 390 204 C 404 194 418 192 430 198 C 438 202 442 180 444 162 Z"/>
  <!-- BODY / tapered chest-to-waist torso with the haunch bulge -->
  <path id="iskra-a-torso" fill="#E2702D" d="M 292 206 C 314 224 326 254 328 288 C 330 320 322 348 314 372 C 306 396 288 410 268 412 C 248 414 230 402 226 382 C 222 362 226 340 228 318 C 230 286 234 250 246 224 C 258 198 274 194 292 206 Z"/>
  <!-- HIND / cream sock on the folded hind paw -->
  <path id="iskra-a-leg-far" fill="#E2702D" d="M 292 376 C 284 400 284 428 288 448 C 292 466 306 472 318 468 C 330 464 332 448 328 432 C 324 412 322 394 324 374 C 312 368 298 368 292 376 Z"/>
  <!-- LEG / planted foreleg with a clear shoulder and ankle -->
