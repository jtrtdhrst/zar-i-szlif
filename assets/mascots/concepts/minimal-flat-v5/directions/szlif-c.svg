<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Szlif direction C — tall sentinel</title>
  <desc id="desc">Szlif the raven, direction C: graphic vertical construction. A tall upright sentinel raven with a long neck, a long dagger ochre bill angled slightly down, a crown of three sharp swept crest plates, a narrow body, a long banner fanned tail held behind, folded wings with long primary tips, long thin legs and a small turquoise notebook tucked against the breast.</desc>

