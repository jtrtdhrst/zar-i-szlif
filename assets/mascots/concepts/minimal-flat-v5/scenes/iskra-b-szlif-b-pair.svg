  <title id="title">Iskra direction B — courier prowler</title>
  <desc id="desc">Iskra the fox, direction B: angular editorial construction. A low forward-leaning fox in mid-dash, faceted planes and straight edges, a wedge head with a triangular muzzle and slit eyes, hard-edged angular fringe over the far eye, a sharp turquoise scarf banner streaming behind, one foreleg stretched forward presenting a turquoise plan tablet, a planted foreleg and a long low streaming tail with a cream tip.</desc>

