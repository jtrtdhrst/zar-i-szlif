  <path id="notebook-pages" fill="#D7DCE3" d="M 330 288 L 337 287 L 345 317 L 338 320 Z"/>
  <!-- NOTEBOOK / plan lines -->
  <path id="notebook-lines" fill="#232833" d="M 274 308 L 322 299 L 323 305 L 275 314 Z"/>
  <!-- TALON / gripping the notebook -->
