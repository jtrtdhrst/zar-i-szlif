  <!-- WING / wide separated primary feather breaking the back outline -->
  <path id="wing-primary-2" fill="#46536A" d="M 230 280 C 204 286 178 302 154 326 C 145 333 153 342 162 335 C 184 314 206 302 228 298 Z"/>
  <!-- WING / wide separated primary feather breaking the back outline -->
  <path id="wing-primary-3" fill="#46536A" d="M 222 300 C 198 312 174 332 152 358 C 144 365 153 373 161 366 C 181 342 202 326 220 318 Z"/>
  <!-- TAIL / open fan of three separated feather tips -->
  <path id="tail" fill="#232833" d="M 240 314 C 204 320 164 340 130 370 L 146 382 L 134 416 L 164 428 L 156 462 C 194 448 224 426 240 394 C 246 370 246 340 240 314 Z"/>
  <!-- LEG / far leg with a bent knee -->
  <path id="leg-far" fill="#E2A03F" d="M 246 322 C 260 324 268 336 266 350 C 264 364 260 376 262 390 C 264 402 262 412 258 420 C 252 424 244 420 244 412 C 244 400 246 388 244 376 C 242 358 238 338 240 328 C 242 323 244 321 246 322 Z"/>
