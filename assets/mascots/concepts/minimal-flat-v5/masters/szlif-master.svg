  <!-- HEAD / angular wedge tilted down toward the plan -->
  <path id="head" fill="#232833" d="M 322 96 L 296 84 L 262 92 L 250 118 L 252 146 L 270 168 L 306 180 L 342 170 L 352 144 L 346 118 Z"/>
