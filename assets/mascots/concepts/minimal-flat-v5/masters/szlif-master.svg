<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Szlif — master raven vector (direction A selected and refined)</title>
  <desc id="desc">Szlif the raven, selected master. Angular construction: a heavy straight ochre bill with a down hook and a thin mandible line, a wedge head tilted down with a low brow over a small eye, three slim crest feathers raked back over the nape, a short throat hackle, a shouldered body tapering to a narrow rump, a broad slate folded wing with three wide separated primary feathers breaking the back outline, an open four-point fanned tail, two ochre legs with a bent knee and splayed toes, and a small turquoise plan notebook held in a talon. Flat vector, five colours, twenty-two named paths.</desc>

  <!-- CREST / slim feather raked back over the crown -->
  <path id="crest-1" fill="#46536A" d="M 300 88 C 274 64 234 48 196 42 C 188 41 186 49 194 52 C 228 60 264 76 292 98 Z"/>
  <!-- CREST / slim feather raked back over the nape -->
  <path id="crest-2" fill="#46536A" d="M 288 102 C 262 82 226 68 194 64 C 186 63 185 71 193 74 C 222 80 254 94 278 112 Z"/>
  <!-- CREST / slim feather raked back over the nape -->
  <path id="crest-3" fill="#46536A" d="M 276 116 C 254 100 224 90 196 90 C 188 90 189 98 197 100 C 222 106 248 116 268 128 Z"/>
  <!-- BODY / shouldered hunched body tapering to a narrow rump -->
  <path id="body" fill="#232833" d="M 288 148 C 262 156 242 182 228 214 C 216 242 206 272 200 300 C 194 324 200 342 218 344 C 244 346 266 330 276 302 C 286 274 290 248 292 218 C 294 188 294 162 292 150 Z"/>
  <!-- WING / broad folded wing over the shoulder -->
  <path id="wing" fill="#46536A" d="M 288 162 C 258 170 238 194 228 224 C 218 254 212 286 210 312 C 226 310 244 300 256 286 C 264 268 268 246 272 224 C 278 196 288 174 296 166 C 298 162 292 160 288 162 Z"/>
  <!-- WING / wide separated primary feather breaking the back outline -->
