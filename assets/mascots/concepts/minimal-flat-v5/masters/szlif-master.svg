<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Szlif — master raven vector (direction A selected and refined)</title>
  <desc id="desc">Szlif the raven, selected master. Angular construction: a heavy straight ochre bill with a down hook angled at the plan, a wedge head tilted down, three broad crest feathers raked back over the nape, shaggy throat hackles, a shouldered body tapering to a narrow rump, a slate folded wing whose stepped primary tips break the back outline, a wide open fanned tail, long thin legs with splayed feet, and a small turquoise plan notebook held in a talon. Flat vector, five colours, eighteen named paths.</desc>

  <!-- CREST / broad feather raked back over the crown -->
  <path id="crest-1" fill="#46536A" d="M 290 78 C 272 62 248 50 224 44 C 214 41 208 49 214 58 C 224 74 248 88 276 96 Z"/>
  <!-- CREST / broad feather raked back over the crown -->
  <path id="crest-2" fill="#46536A" d="M 274 94 C 256 80 234 68 212 62 C 202 60 198 68 204 76 C 214 90 236 102 260 110 Z"/>
  <!-- CREST / broad feather raked back over the nape -->
  <path id="crest-3" fill="#46536A" d="M 256 112 C 240 102 220 94 202 94 C 192 94 189 102 195 109 C 205 120 226 128 246 132 Z"/>
  <!-- TAIL / wide open fan of separated feather tips -->
  <path id="tail" fill="#232833" d="M 212 292 C 198 298 184 312 172 328 L 122 352 L 156 372 L 124 404 L 164 412 L 142 448 L 182 440 L 176 476 L 212 456 C 232 442 240 416 236 390 C 232 358 222 320 212 292 Z"/>
  <!-- LEGS / long thin bird legs -->
  <path id="legs" fill="#E2A03F" d="M 216 344 L 230 344 L 228 396 L 232 440 L 220 442 L 214 394 Z M 244 340 L 258 338 L 262 390 L 268 432 L 256 436 L 248 390 Z"/>
  <!-- FEET / splayed toes, three forward and one back -->
