  <!-- BODY / shouldered hunched body tapering to a narrow rump -->
  <path id="body" fill="#232833" d="M 282 152 C 260 164 242 190 230 222 C 218 254 212 288 208 318 C 204 342 212 356 228 358 C 248 360 264 344 274 318 C 284 292 288 258 290 222 C 292 190 292 164 288 154 Z"/>
  <!-- WING / folded wing whose stepped primary tips break the back outline -->
  <path id="wing" fill="#46536A" d="M 280 168 C 258 180 240 202 228 230 C 216 254 210 280 206 302 L 172 328 L 200 320 L 178 350 L 204 340 L 186 368 L 212 346 L 218 318 L 224 288 L 234 258 L 248 230 L 264 208 L 280 196 Z"/>
  <!-- HEAD / angular wedge tilted down toward the plan -->
  <path id="head" fill="#232833" d="M 322 96 L 296 84 L 262 92 L 250 118 L 252 146 L 270 168 L 306 180 L 342 170 L 352 144 L 346 118 Z"/>
  <!-- THROAT / shaggy hackle breaking the throat line -->
  <path id="hackle" fill="#232833" d="M 268 164 L 344 164 L 338 188 L 328 222 L 314 190 L 300 226 L 290 188 L 272 200 Z"/>
  <!-- BILL / heavy straight wedge with a down hook, angled at the plan -->
  <path id="bill" fill="#E2A03F" d="M 346 116 L 392 138 L 430 162 L 440 180 L 432 196 L 414 190 L 380 172 L 348 150 Z"/>
  <!-- BILL / mandible split -->
  <path id="bill-mandible" fill="#46536A" d="M 350 138 L 402 158 L 410 168 L 352 150 Z"/>
  <!-- EYE / small pale almond -->
  <path id="eye" fill="#D7DCE3" d="M 286 116 C 286 113 291 111 297 111 C 303 111 308 113 308 116 C 308 119 303 121 297 121 C 291 121 286 119 286 116 Z"/>
  <!-- EYE / dark pupil -->
  <path id="pupil" fill="#232833" d="M 292 116 C 292 114 295 113 298 113 C 301 113 303 114 303 116 C 303 118 300 119 297 119 C 294 119 292 118 292 116 Z"/>
  <!-- NOTEBOOK / small turquoise plan notebook -->
  <path id="notebook" fill="#2BB8A6" d="M 262 300 L 330 288 L 338 320 L 270 332 Z"/>
