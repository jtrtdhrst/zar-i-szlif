<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Iskra — master fox vector (direction A selected and refined)</title>
  <desc id="desc">Iskra the fox, selected master. Soft-round construction: an upright torso with a wide chest and a tucked waist carried on two articulated legs with a bent knee and a cream sock on each shin, a broad tail sweeping up from the rump with a cream tip, a rounded head with a narrow projecting muzzle and cream jaw, a rust fringe lock rooted on the crown that sweeps diagonally across the far eye and flicks out over the cheek, a turquoise scarf wrapped round the neck with a bulky knot at the throat and a wide end flying behind the head, and one arm with a real shoulder holding a large turquoise plan sheet. Flat vector, five colours, twenty-two named paths.</desc>

  <!-- TAIL / broad plume sweeping up-right from the rump -->
  <path id="tail" fill="#E2702D" d="M 278 382 C 310 368 344 346 370 320 C 394 296 411 270 420 244 C 427 224 431 202 427 184 C 424 166 403 164 396 178 C 388 192 390 212 382 234 C 372 262 354 288 334 314 C 314 340 296 364 289 384 C 288 390 276 390 278 382 Z"/>
  <!-- TAIL / cream tip -->
  <path id="tail-tip" fill="#F7E8D3" d="M 427 184 C 424 166 403 164 396 178 C 392 186 391 196 390 206 C 400 198 412 194 422 198 C 427 200 429 194 427 184 Z"/>
  <!-- LEG / far leg, thigh and shin with a bent knee, behind the body -->
  <path id="leg-far" fill="#E2702D" d="M 296 344 C 310 344 320 358 320 376 C 321 392 317 408 314 422 C 312 434 314 446 320 446 C 326 446 328 438 325 428 C 321 414 322 398 325 384 C 329 364 320 346 304 343 C 296 342 294 343 296 344 Z"/>
  <!-- LEG / cream sock on the far shin -->
  <path id="sock-far" fill="#F7E8D3" d="M 310 420 C 318 418 328 422 330 430 C 332 438 328 446 320 446 C 312 446 308 440 308 432 C 308 426 308 422 310 420 Z"/>
  <!-- BODY / full chest tapering to a rounded rump -->
  <path id="torso" fill="#E2702D" d="M 250 210 C 234 218 226 234 228 252 C 230 270 238 284 243 298 C 247 312 244 326 246 338 C 248 352 258 360 274 360 C 294 360 308 348 310 330 C 312 312 308 298 303 286 C 300 272 312 256 313 242 C 314 222 300 206 282 203 C 272 201 258 203 250 210 Z"/>
