  <path id="ear-near" fill="#E2702D" d="M 272 86 C 278 56 292 24 310 6 C 324 26 334 58 336 86 C 316 96 290 96 272 86 Z"/>

  <!-- PLAN / ink lines on the plan sheet -->
  <path id="plan-lines" fill="#2B2A33" d="M 62 258 L 124 250 L 126 258 L 64 266 Z M 66 282 L 128 274 L 130 282 L 68 290 Z"/>

</svg>
