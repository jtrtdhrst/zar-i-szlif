  <path id="leg-near" fill="#E2702D" d="M 250 340 C 266 342 278 356 278 374 C 278 388 272 398 266 404 C 259 412 259 428 263 440 C 265 448 271 454 277 452 C 283 450 283 440 279 430 C 275 418 275 402 281 390 C 287 374 284 356 268 348 C 258 344 248 337 250 340 Z"/>
  <!-- LEG / cream sock on the near shin -->
  <path id="sock-near" fill="#F7E8D3" d="M 259 428 C 267 426 277 430 281 438 C 285 446 281 456 273 458 C 263 460 255 454 255 444 C 255 436 255 431 259 428 Z"/>
  <!-- ARM / shoulder cap, upper arm and forearm reaching out to the plan sheet -->
  <path id="arm" fill="#E2702D" d="M 250 234 C 268 236 277 252 271 268 C 265 280 250 288 234 292 C 216 296 194 300 178 302 C 164 304 154 296 158 286 C 162 276 176 272 190 270 C 208 267 224 260 234 250 C 240 244 242 232 250 234 Z"/>
