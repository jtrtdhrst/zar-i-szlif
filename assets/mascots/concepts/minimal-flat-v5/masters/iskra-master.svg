  <path id="scarf" fill="#2BB8A6" d="M 210 208 C 228 220 250 226 272 222 C 292 218 308 208 318 200 C 326 194 334 200 332 210 C 330 220 320 232 302 240 C 282 249 258 252 238 248 C 218 244 202 234 202 222 C 202 214 204 210 210 208 Z"/>
  <!-- SCARF / bulky knot where the band turns -->
  <path id="scarf-knot" fill="#2BB8A6" d="M 300 186 C 312 180 328 184 334 194 C 340 204 336 220 326 226 C 316 232 300 230 292 222 C 284 214 288 192 300 186 Z"/>
  <!-- SCARF / end flying over the shoulder -->
  <path id="scarf-end" fill="#2BB8A6" d="M 322 212 C 332 206 342 214 344 228 C 346 244 342 268 336 284 C 330 300 318 308 310 302 C 302 296 304 278 308 262 C 312 246 312 220 322 212 Z"/>
