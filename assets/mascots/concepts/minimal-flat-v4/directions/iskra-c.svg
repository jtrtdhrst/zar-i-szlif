<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Iskra — style direction C, reduced emblematic icon</title>
  <desc id="desc">Design exploration C for Iskra the fox: reduced emblematic construction from a circle skull, a triangular muzzle, two triangle ears, a single teal scarf shield and one oversized angular sickle tail, tuned to stay legible at 32 pixels. Flat vector, five colours.</desc>
  <!-- Exploration C — reduced emblematic. Flat vector, no raster, filters, gradients or scripts. -->
  <!-- ISKRA / C / TAIL / oversized angular sickle, the signature element -->
