  <title id="title">Szlif — style direction A, perched thinker</title>
  <desc id="desc">Design exploration A for Szlif the raven: upright perched posture on a slim branch, three swept-back crest feathers rooted in the crown, sharp angular ochre bill with a deep down-turned hook, folded wing with separated primary feathers, tapered pale breast, small hooded skeptical eye. Flat vector, five colours.</desc>
