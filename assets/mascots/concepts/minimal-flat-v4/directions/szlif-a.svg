<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Szlif — design direction A, perched thinker with a swept crest</title>
  <desc id="desc">Szlif the raven: wedge head tilted down with a massive straight ochre bill and a short down hook, flat crown with three broad raked-back crest feathers, shaggy throat hackles, broad shoulders tapering to a narrow rump, folded wing with stepped primary tips breaking the back outline, long wedge tail, bent bird legs, and a turquoise plan notebook gripped in a talon. Flat vector, five colours.</desc>
