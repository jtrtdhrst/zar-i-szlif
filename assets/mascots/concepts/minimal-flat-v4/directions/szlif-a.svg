<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Szlif — style direction A, perched thinker with swept crest</title>
  <desc id="desc">Design exploration A for Szlif the raven: heavy wedge head with a long down-hooked ochre beak and a gape line, three crest feathers swept back along the crown, broad shoulders tapering to the rump, folded wing with stepped primary tips breaking the silhouette, fanned tail wedge, bent bird legs and a slim perch. Flat vector, four colours.</desc>
  <!-- Exploration A — corvid proportion, soft-angular. Flat vector, no raster, filters, gradients or scripts. -->
  <!-- SZLIF / A / BRANCH / slim perch, drawn first so the tail hangs in front of it -->
