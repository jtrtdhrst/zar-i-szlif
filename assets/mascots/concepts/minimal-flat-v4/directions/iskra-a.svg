<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Iskra — style direction A, soft-round three-quarter sitter</title>
  <desc id="desc">Design exploration A for Iskra the fox: soft-round construction, three-quarter head whose silhouette tapers into a projecting snout, small almond eyes, asymmetric brow fringe, tilted turquoise scarf with knot and flying end, one raised foreleg with attached paw, large tail integrated at the haunch. Flat vector, five colours.</desc>
