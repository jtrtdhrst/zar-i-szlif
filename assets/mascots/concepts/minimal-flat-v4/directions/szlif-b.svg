  <title id="title">Szlif — style direction B, soft-round contemplative</title>
  <desc id="desc">Design exploration B for Szlif the raven: soft rounded construction with no hard edges, a rounded pompadour crest, a short gently curved hooked beak tilted upward, a plump body, a soft folded wing, a rounded tail fan and ochre feet on the ground. Flat vector, four colours.</desc>
