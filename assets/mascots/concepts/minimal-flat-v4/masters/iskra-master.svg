<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Iskra — master fox vector (direction A refined)</title>
  <desc id="desc">Iskra the fox proposes, Szlif the raven evaluates with a plan notebook. Composed from the master pair with deterministic transforms.</desc>

  <title id="title">Iskra — design direction A, soft-round three-quarter sitter</title>
  <desc id="desc">Iskra the fox: soft-round construction, projecting snout, small almond eyes, an ink lock of hair rooted above the crown and crossing the far eye with a cowlick tuft breaking the crown line, a tilted turquoise scarf passing under the chin with a bulky knot and an end over the shoulder, one raised foreleg with a cream mitten holding a turquoise plan card, broad plume tail with a cream tip. Flat vector, five colours.</desc>
