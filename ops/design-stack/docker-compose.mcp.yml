name: plasmic-mcp
services:
  plasmic-mcp:
    # Ten sam obraz co `opendesign-bridge-mcp`: `Dockerfile.mcp` zawiera oba serwery,
    # a `command` wybiera serwer. Obraz buduje CI (push na `main`) i taguje SHA.
    # IMAGE_TAG jest WYMAGANE (`:?`) — brak zmiennej przerywa deploy zamiast
    # ciągnąć pływający tag `latest`, który łamie kontrakt "deploy = SHA z main"
    # (docs/design-stack/operations.md) i nie pozwala odtworzyć wdrożenia.
    image: ghcr.io/miloszspyrka-code/kompas-zbiorek-opendesign-mcp:${IMAGE_TAG:?IMAGE_TAG required: commit SHA from main (see docs/design-stack/operations.md)}
    pull_policy: always
    command: ["node", "services/plasmic-mcp/server.ts"]
    environment:
      # Publiczny URL (nie wewnętrzny http): WAB stawia ciasteczko sesji
      # (Secure) tylko przez HTTPS/proxy — inaczej login pada na CSRF.
      PLASMIC_BASE_URL: https://plasmic.kompaszbiorek.pl
      PLASMIC_EMAIL: ${PLASMIC_EMAIL:?}
      PLASMIC_PASSWORD: ${PLASMIC_PASSWORD:?}
      PLASMIC_STATE_DIR: /state
      MCP_HTTP_PORT: "8091"
      MCP_AUTH_TOKEN: ${PLASMIC_MCP_TOKEN:?}
      PAPERCLIP_AGENT_ID: ${PAPERCLIP_AGENT_ID:-}
      PAPERCLIP_RUN_ID: ${PAPERCLIP_RUN_ID:-}
    networks: [plasmic_default]
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 64
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - plasmic_mcp_state:/state
    logging: { driver: local, options: { max-size: 10m, max-file: "3" } }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  opendesign-bridge-mcp:
    # Ten sam obraz i ten sam tag co `plasmic-mcp` (oba serwery w jednym obrazie CI,
    # `command` wybiera serwer) — jeden kontrakt tagu, jeden rollback.
    image: ghcr.io/miloszspyrka-code/kompas-zbiorek-opendesign-mcp:${IMAGE_TAG:?IMAGE_TAG required: commit SHA from main (see docs/design-stack/operations.md)}
    pull_policy: always
    command: ["node", "services/opendesign-bridge-mcp/server.ts"]
    environment:
      OD_HOST: open-design
      OD_PORT: "7456"
      OD_API_TOKEN: ${OD_API_TOKEN:?}
      MCP_HTTP_PORT: "8092"
      MCP_AUTH_TOKEN: ${OPENDESIGN_BRIDGE_TOKEN:?}
      BRAND_WRITE_ENABLED: ${OPENDESIGN_BRAND_WRITE_ENABLED:-true}
      BRAND_ASSET_MAX_BYTES: ${OPENDESIGN_BRAND_ASSET_MAX_BYTES:-5000000}
      MCP_MAX_BODY_BYTES: ${OPENDESIGN_MCP_MAX_BODY_BYTES:-7500000}
    networks: [open-design_default]
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 64
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 15s
    logging: { driver: local, options: { max-size: 10m, max-file: "3" } }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8092/ready >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  plasmic_default: { external: true }
  open-design_default: { external: true }
volumes:
  plasmic_mcp_state:
