server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mirror of the vercel.json redirects: /panel is served by the panel host.
    location = /panel {
        return 302 https://panel.kompaszbiorek.pl/panel;
    }

    location ^~ /panel/ {
        return 302 https://panel.kompaszbiorek.pl$request_uri;
    }

    # Single-page app: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
