server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Readiness probe: exact match only, literal text/plain, never the SPA shell.
    # `/healthz/extra` deliberately does not match this `=` location.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # /panel is served by the panel host (Cloudflare Worker), not by this site.
    location = /panel {
        return 302 https://panel.kompaszbiorek.pl/panel;
    }

    location ^~ /panel/ {
        return 302 https://panel.kompaszbiorek.pl$request_uri;
    }

    # Single-page app: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
