name: Build Plasmic Studio

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Pinned plasmicapp/plasmic commit to build
        required: true
        default: 9890e0caab4162e8d0626a0ab2458098b6706089
  push:
    branches: [main]
    paths:
      - .github/workflows/build-plasmic.yml
      - mcp/plasmic/studio-overrides/plasmic.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: plasmic-wab-build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/miloszspyrka-code/plasmic-wab
  UPSTREAM_REF: 9890e0caab4162e8d0626a0ab2458098b6706089

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: plasmicapp/plasmic
          ref: ${{ inputs.upstream_ref || env.UPSTREAM_REF }}
          path: upstream
          fetch-depth: 1

      - name: Checkout local repository with managed Plasmic publish template
        uses: actions/checkout@v4
        with:
          path: repository
          persist-credentials: false

      - name: Apply self-hosted GitHub publishing template
        run: |
          test -f repository/mcp/plasmic/studio-overrides/plasmic.yml
          test -f upstream/platform/wab/src/wab/server/github/plasmic.yml
          cp repository/mcp/plasmic/studio-overrides/plasmic.yml upstream/platform/wab/src/wab/server/github/plasmic.yml
          grep -q 'PLASMIC_DEFAULT_HOST' upstream/platform/wab/src/wab/server/github/plasmic.yml
          grep -q 'npm install --global pnpm@12' upstream/platform/wab/src/wab/server/github/plasmic.yml

      - name: Restore optional shared workspace directory for pinned upstream
        run: |
          # The pinned Plasmic commit lacks platform/shared/, yet its Dockerfile
          # copies /platform/shared from the builder into the runtime image.
          if [ ! -d upstream/platform/shared ]; then
            mkdir -p upstream/platform/shared
            printf '%s\n' 'Placeholder for upstream release without platform/shared.' > upstream/platform/shared/.keep
          fi

      - id: upstream
        run: echo "sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: upstream/platform
          file: upstream/platform/wab/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.upstream.outputs.sha }}-overlay-${{ github.sha }}
            ${{ env.IMAGE }}:stable
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          provenance: mode=max
          sbom: true
