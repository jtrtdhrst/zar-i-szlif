name: Paperclip execution truth regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'mcp/paperclip/src/control-plane.ts'
      - 'mcp/paperclip/src/execution-truth*.ts'
      - '.github/workflows/paperclip-execution-truth-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mcp/paperclip/src/control-plane.ts'
      - 'mcp/paperclip/src/execution-truth*.ts'
      - '.github/workflows/paperclip-execution-truth-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  execution-truth-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned MCP compatibility dependencies
        run: npm install --no-save --ignore-scripts --no-audit --no-fund zod@4.1.13
      - name: Execution truth unit and mocked-handler regression tests
        run: |
          npx --no-install vitest run \
            mcp/paperclip/src/execution-truth-portable.test.ts \
            mcp/paperclip/src/execution-truth-regression.test.ts
      - name: Check execution truth module TypeScript
        run: npx --no-install tsc --noEmit --skipLibCheck --target ES2022 --module nodenext --moduleResolution nodenext mcp/paperclip/src/execution-truth.ts
      # The control-plane integration tests import Paperclip Core packages.
      # Run full regression/integration in the pinned Paperclip runtime before deployment.
