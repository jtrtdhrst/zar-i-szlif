name: Legacy branch cleanup Git auth preflight
on:
  push:
    branches: [product/www]
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify git remote read and dry-run write
        shell: bash
        run: |
          set -Eeuo pipefail
          git remote -v
          git ls-remote origin refs/heads/main
          git push --dry-run origin HEAD:refs/heads/__e2e_cleanup_preflight_never_create__
          echo 'GIT_WRITE_DRY_RUN_OK'
