name: Product MCP Worker CI
on:
  pull_request:
    branches: [product/www]
    paths:
      - "app/mcp-worker/**"
      - "app/plugin/knowledge/**"
      - ".github/workflows/product-mcp-ci.yml"
  push:
    branches: [product/www]
    paths:
      - "app/mcp-worker/**"
      - "app/plugin/knowledge/**"
      - ".github/workflows/product-mcp-ci.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/mcp-worker/package-lock.json
      - run: npm ci --prefix app/mcp-worker
      - run: npm run build
        working-directory: app/mcp-worker
      - run: npx wrangler deploy --dry-run --config wrangler.jsonc
        working-directory: app/mcp-worker
