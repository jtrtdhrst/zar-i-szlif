name: Paperclip MCP source and gateway tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'mcp/paperclip/**'
      - '.github/workflows/paperclip-mcp-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mcp/paperclip/**'
      - '.github/workflows/paperclip-mcp-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paperclip-mcp-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install repository test dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      # This checkout contains only custom MCP code, not the upstream Paperclip
      # Core monorepo. These source tests are portable; the full 504-test suite
      # must additionally run in the pinned Paperclip 2026.1012.0 runtime.
      - name: Portable MCP credential isolation tests
        run: |
          npx --no-install vitest run \
            mcp/paperclip/src/config-board-credential-isolation.test.ts \
            mcp/paperclip/src/board-credential-projection.test.ts
      - name: Verify gateway JavaScript syntax before tests
        run: |
          node --check mcp/paperclip/mcp-gateway/identity-retry.mjs
          node --check mcp/paperclip/mcp-gateway/gateway.mjs
      - name: Gateway identity and origin tests
        run: node --test mcp/paperclip/mcp-gateway/test/*.test.mjs
      - name: Coolify release contract (positive and negative auth)
        run: |
          node --check mcp/paperclip/scripts/coolify-release.mjs
          node --test mcp/paperclip/scripts/coolify-release.test.mjs
      - name: Supervisor must not be registered as a live MCP tool
        run: node --test mcp/paperclip/scripts/retired-supervisor.test.mjs
      - name: Validate exact-source public canary contract
        run: node --test mcp/paperclip/scripts/verify-coolify-canary.test.mjs
      - name: Verify actual Coolify canary release after main deployment
        if: github.event_name == 'push'
        timeout-minutes: 12
        run: node mcp/paperclip/scripts/verify-coolify-canary.mjs
      - name: Check gateway and transport scripts
        run: |
          node --check mcp/paperclip/mcp-gateway/gateway.mjs
          node --check mcp/paperclip/scripts/mcp-per-tool-e2e.mjs
          bash -n mcp/paperclip/entrypoint.sh


