name: Product CI
# RELEASE_OWNER: native-paperclip-product-promotion-v1
# This workflow validates source but NEVER advances ci-approved or deploys.
# Reviewed promotion is performed by the versioned Ubuntu controller only after
# verifying each merged main PR, first-class Paperclip decision, exact SHA/CI
# and Coolify HTTP readback. See Harness KOMAA-1513 and Product KOMAA-1611.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "registry/**"
      - "content/**"
      - "ops/coolify/**"
      - "ops/mascot-worker/**"
      - "ops/ci/**"
      - "ops/service-build-roots.json"
      - "scripts/**"
      - "tests/**"
      - "product/**"
      - "www/**"
      - "mcp/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/product-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-product:
    # Only reviewed main code may run on a persistent self-hosted runner.
    # GitHub PR source runs must use separately authorized root-owned LOCAL CI,
    # never PR-controlled workflow YAML. Independent CTO reviews exact head SHA.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, zis-local-build]
    timeout-minutes: 25
    env:
      DOCKER_HOST: unix:///run/zis-rootless-docker/docker.sock

      CI_VALIDATION_TAG: product-ci:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-validation
      CI_VERIFIED_TAG: product-ci:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-verified
      CI_CANARY_NAME: product-ci-release-check-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Defense in depth - root-owned main-only admission and rootless isolation
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main'
          [[ "${GITHUB_EVENT_NAME}" == 'push' || "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]
          test "${GITHUB_REPOSITORY}" = 'jtrtdhrst/zar-i-szlif'
          test "$(id -un)" = actions-zis-product
          test -S /run/zis-rootless-docker/docker.sock
          docker info --format '{{json .SecurityOptions}}' | grep -q rootless
          ! test -w /var/run/docker.sock
          ! test -r /opt/zis-actions-runner-harness/.credentials
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify checked-out main SHA before executing repository code
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'jtrtdhrst/zar-i-szlif'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse --verify HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --verify HEAD)" = "$(git rev-parse --verify refs/remotes/origin/main)"
      - name: Enforce external reviewed-promotion contract
        run: python3 -m unittest discover -s tests -p test_release_promotion_contract.py -v
      # The repository root is never a Docker build context. Full-repository
      # validation instead uses a read-only checkout bind mount and an ephemeral
      # rootless volume, then reruns tests with all container networking disabled.
      - name: Build disposable validation toolchain (not a product image)
        run: |
          set -euo pipefail
          docker build --file ops/coolify/Dockerfile.ci --tag "$CI_VALIDATION_TAG" ops/coolify
      - name: Full Product lint, typecheck and tests in isolated rootless container
        shell: bash
        run: |
          set -euo pipefail
          volume="zis-product-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker volume create "$volume" >/dev/null
          trap 'docker volume rm "$volume" >/dev/null 2>&1 || true' EXIT
          docker run --rm --network bridge \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --cpus 2 --memory 4g --memory-swap 4g \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --mount "type=volume,src=$volume,dst=/workspace" \
            "$CI_VALIDATION_TAG" sh -ec '
              cp -R /source/. /workspace/
              cd /workspace
              npm ci --no-audit --no-fund
              npm --prefix mcp/product-host ci --no-audit --no-fund
            '
          docker run --rm --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --cpus 2 --memory 4g --memory-swap 4g \
            --env npm_config_offline=true \
            --mount "type=volume,src=$volume,dst=/workspace" \
            --workdir /workspace "$CI_VALIDATION_TAG" \
            sh -ec 'npm run validate:code'
      - name: Build web OCI image from app/web and named shared inputs only
        run: |
          set -euo pipefail
          docker build --build-context registry=./registry --build-context config=./ops/coolify \
            --file app/web/Dockerfile --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$CI_VERIFIED_TAG" app/web
      - name: Verify source SHA is emitted by the real nginx entrypoint
        run: |
          set -euo pipefail
          name="$CI_CANARY_NAME"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --network none --memory 384m --memory-swap 384m --cpus 1 -e SOURCE_COMMIT="${GITHUB_SHA}" "$CI_VERIFIED_TAG"
          docker exec "$name" cat /usr/share/nginx/html/__release.json | python3 -c 'import json,os,sys; x=json.load(sys.stdin); assert x["commit"]==os.environ["GITHUB_SHA"], "wrong image source SHA"; assert x["source"]=="jtrtdhrst/zar-i-szlif"'
      - name: Reject versionless container starts
        run: |
          negative="${RUNNER_TEMP}/negative-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          if docker run --rm --network none --memory 384m --memory-swap 384m --cpus 1 "$CI_VERIFIED_TAG" > "$negative" 2>&1; then
            echo 'FAIL: missing SOURCE_COMMIT must prevent startup' >&2
            exit 1
          fi
          grep -q 'release provenance unavailable' "$negative"
