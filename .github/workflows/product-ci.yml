name: Product CI
# RELEASE_OWNER: native-paperclip-product-promotion-v1
# This workflow validates source but NEVER advances ci-approved or deploys.
# Reviewed promotion is performed by the versioned Ubuntu controller only after
# verifying each merged main PR, first-class Paperclip decision, exact SHA/CI
# and Coolify HTTP readback. See Harness KOMAA-1513 and Product KOMAA-1611.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "registry/**"
      - "content/**"
      - "ops/coolify/**"
      - "scripts/**"
      - "tests/**"
      - "product/**"
      - "www/**"
      - "mcp/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/product-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-product:
    # Only reviewed main code may run on a persistent self-hosted runner.
    # GitHub PR source runs must use separately authorized root-owned LOCAL CI,
    # never PR-controlled workflow YAML. Independent CTO reviews exact head SHA.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, zis-local-build]
    timeout-minutes: 25
    env:
      DOCKER_HOST: unix:///run/zis-rootless-docker/docker.sock
    steps:
      - name: Defense in depth - root-owned main-only admission and rootless isolation
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main'
          [[ "${GITHUB_EVENT_NAME}" == 'push' || "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]
          test "${GITHUB_REPOSITORY}" = 'miloszspyrka-code/zar-i-szlif'
          test "$(id -un)" = actions-zis-product
          test -S /run/zis-rootless-docker/docker.sock
          docker info --format '{{json .SecurityOptions}}' | grep -q rootless
          ! test -w /var/run/docker.sock
          ! test -r /opt/zis-actions-runner-harness/.credentials
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce external reviewed-promotion contract
        run: python3 -m unittest discover -s tests -p test_release_promotion_contract.py -v
      # Dependency installation happens only inside the rootless Docker build;
      # never run package lifecycle scripts directly on the persistent runner.
      - name: Product lint, typecheck and tests (no host loopback access)
        run: |
          set -euo pipefail
          # Build dependencies have normal outbound access inside rootless Docker.
          # The actual tests run in a separate container with NO network,
          # preserving their own 127.0.0.1 mock servers without touching the VPS.
          docker build --file ops/coolify/Dockerfile --target build --tag product-ci:build .
          docker build --file ops/coolify/Dockerfile.ci --tag product-ci:validation .
          docker run --rm --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 512 --memory 5g \
            --env npm_config_offline=true \
            product-ci:validation sh -c 'npm run validate:code'
      - name: Reproducible Coolify container build
        run: docker build --file ops/coolify/Dockerfile --tag product-ci:verified .
      - name: Verify source SHA is emitted by the real nginx entrypoint
        run: |
          set -euo pipefail
          name=product-ci-release-check
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --network none -e SOURCE_COMMIT="${GITHUB_SHA}" product-ci:verified
          docker exec "$name" cat /usr/share/nginx/html/__release.json > /tmp/release.json
          python3 -c 'import json,os; x=json.load(open("/tmp/release.json")); assert x["commit"]==os.environ["GITHUB_SHA"], "wrong image source SHA"; assert x["source"]=="zar-i-szlif/main"'
      - name: Reject versionless container starts
        run: |
          if docker run --rm --network none product-ci:verified > /tmp/negative-release.log 2>&1; then
            echo 'FAIL: missing SOURCE_COMMIT must prevent startup' >&2
            exit 1
          fi
          grep -q 'release provenance unavailable' /tmp/negative-release.log
