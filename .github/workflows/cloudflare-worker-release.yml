name: Cloudflare Worker Release

on:
  push:
    branches: [main]
    paths:
      - "app/cloudflare-worker/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix app/cloudflare-worker
      - run: npm run validate:worker

  production-preflight:
    needs: verify-worker
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify required Cloudflare production secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing production secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing production secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          test "${missing}" -eq 0
      - name: Verify Cloudflare authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.123.0 whoami

  deploy-production:
    needs: production-preflight
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix app/cloudflare-worker
      # worker.js jest generowany przez build-worker.mjs, a src/mcp.ts importuje
      # ../../plugin/server.js -> bez `npm run build` nie ma app/plugin/dist, wiec
      # esbuild cofa sie do server.ts i nie znajduje zod / @modelcontextprotocol/sdk
      # (zaden z tych pakietow nie jest deps app/cloudflare-worker).
      - run: npm run build
      - name: Deploy Cloudflare Worker
        working-directory: app/cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --keep-vars --config wrangler.panel.jsonc
