name: Archive and prune legacy branches (one-time)
on:
  push:
    branches:
      - product/www
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'miloszspyrka-code/zar-i-szlif'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 0ebbfdfaf811781dbe26d75a44bf2baff190d656
    steps:
      - name: Verify, archive branch heads to trash tags, then prune
        shell: bash
        run: |
          set -Eeuo pipefail
          repo="$GITHUB_REPOSITORY"
          namespace="trash/2026-10-29"
          main_sha="$(gh api "repos/$repo/branches/main" --jq '.commit.sha')"
          if [[ "$main_sha" != "$EXPECTED_MAIN" ]]; then echo 'MAIN_CHANGED'; exit 1; fi
          open_prs="$(gh api "repos/$repo/pulls?state=open&per_page=100" --jq 'length')"
          if [[ "$open_prs" != "0" ]]; then echo 'OPEN_PRS_FOUND'; exit 1; fi
          mapfile -t branches < <(gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name' | grep -v '^main$' | sort -u)
          if (( ${#branches[@]} < 1 || ${#branches[@]} > 70 )); then echo 'BRANCH_COUNT_UNEXPECTED'; exit 1; fi
          echo "Archiving ${#branches[@]} branch refs to tag namespace: $namespace"
          declare -A snapshots
          for branch in "${branches[@]}"; do
            protected="$(gh api "repos/$repo/branches/$branch" --jq '.protected')"
            if [[ "$protected" != "false" ]]; then echo "Protected: $branch"; exit 1; fi
            sha="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')"
            tag="${namespace}/${branch}"
            current_tag="$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)"
            if [[ -z "$current_tag" ]]; then
              gh api -X POST "repos/$repo/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
              current_tag="$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')"
            fi
            if [[ "$current_tag" != "$sha" ]]; then echo "Tag mismatch: $branch"; exit 1; fi
            snapshots["$branch"]="$sha"
          done
          echo "Verified ${#snapshots[@]} recovery tags; now deleting branch refs"
          for branch in "${branches[@]}"; do
            live="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')"
            if [[ "$live" != "${snapshots[$branch]}" ]]; then echo "Branch SHA changed: $branch"; exit 1; fi
            gh api -X DELETE "repos/$repo/git/refs/heads/$branch"
            echo "Deleted: $branch"
          done
          remaining="$(gh api "repos/$repo/branches?per_page=100" --jq '[.[] | select(.name != "main")] | length')"
          if [[ "$remaining" != "0" ]]; then echo "Remaining: $remaining"; exit 1; fi
          echo "DONE: main only; ${#snapshots[@]} recovery tags retained"
