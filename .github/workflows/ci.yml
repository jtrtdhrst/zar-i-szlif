name: CI

on:
  push:
    branches: ['release/panel-*']
  pull_request:
    branches: ['release/panel-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Identity gate compares against the PR target branch or prior push.
          # Full history is required for reliable merge-base checks.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix app/cloudflare-worker
      - name: Reject synthetic Git identities
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          target_branch="$TARGET_BRANCH"
          git fetch --no-tags origin "$target_branch"
          base="origin/$target_branch"
          if [ "${{ github.event_name }}" = "push" ]; then
            case "${{ github.event.before }}" in
              ""|0*) ;;
              *) base="${{ github.event.before }}" ;;
            esac
          fi
          node scripts/assert-git-identity.mjs --base="$base" --head=HEAD
      - run: npm run validate:code
      - run: npm run build
      - name: Verify generated artifacts
        run: |
          test -s app/web/dist/index.html
          test -s app/cloudflare-worker/worker.js
          node --check app/cloudflare-worker/worker.js
      - uses: actions/upload-artifact@v4
        with:
          name: kompas-build-${{ github.sha }}
          retention-days: 7
          path: |
            app/web/dist/**
            app/cloudflare-worker/worker.js
