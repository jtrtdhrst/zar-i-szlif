name: Infrastructure CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify product code stays in archive
        run: |
          set -euo pipefail
          for dir in app registry content supabase ops/coolify; do
            if [ -e "$dir" ]; then
              echo "::error::Product directory $dir must live in kompaszbiorek-archiwum"
              exit 1
            fi
          done
      - run: npm ci --ignore-scripts
      - name: Reject synthetic Git identities
        run: |
          git fetch --no-tags origin main
          base="origin/main"
          if [ "${{ github.event_name }}" = "push" ]; then
            case "${{ github.event.before }}" in
              ""|0*) ;;
              *) base="${{ github.event.before }}" ;;
            esac
          fi
          node scripts/assert-git-identity.mjs --base="$base" --head=HEAD
      - run: npm run validate:code
