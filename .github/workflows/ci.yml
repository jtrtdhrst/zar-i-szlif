name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix app/cloudflare-worker
      - run: npm run validate:code
      - run: npm run build
      - name: Verify generated artifacts
        run: |
          test -s app/web/dist/index.html
          test -s app/cloudflare-worker/worker.js
          node --check app/cloudflare-worker/worker.js
      - uses: actions/upload-artifact@v4
        with:
          name: kompas-build-${{ github.sha }}
          retention-days: 7
          path: |
            app/web/dist/**
            app/cloudflare-worker/worker.js
