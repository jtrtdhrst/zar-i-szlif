name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix app/cloudflare-worker
      - run: npm run validate:code
      - run: npm run build
      - name: Verify generated production artifact
        run: |
          test -s app/web/dist/index.html
          test -s app/cloudflare-worker/worker.js
          node --check app/cloudflare-worker/worker.js
      - uses: actions/upload-artifact@v4
        with:
          name: kompas-production-${{ github.sha }}
          retention-days: 7
          path: |
            app/web/dist/**
            app/cloudflare-worker/worker.js

  deploy-dry-run:
    needs: verify-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix app/cloudflare-worker
      - uses: actions/download-artifact@v4
        with:
          name: kompas-production-${{ github.sha }}
      - name: Confirm main-only release boundary
        run: test "${GITHUB_REF}" = "refs/heads/main"
        if: github.event_name == 'push'
      - name: Dry-run Cloudflare production bundle
        working-directory: app/cloudflare-worker
        run: npx wrangler deploy --dry-run --config wrangler.panel.jsonc

  production-preflight:
    needs: deploy-dry-run
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify required Cloudflare production secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing production secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing production secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          test "${missing}" -eq 0
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefix app/cloudflare-worker
      - name: Verify Cloudflare authentication
        working-directory: app/cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami

  deploy-production:
    needs: production-preflight
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix app/cloudflare-worker
      - uses: actions/download-artifact@v4
        with:
          name: kompas-production-${{ github.sha }}
      - name: Confirm main-only production deploy
        run: test "${GITHUB_REF}" = "refs/heads/main"
      - name: Deploy panel to Cloudflare
        working-directory: app/cloudflare-worker
        run: npx wrangler deploy --keep-vars --config wrangler.panel.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
