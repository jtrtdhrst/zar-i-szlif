name: Plasmic Website — isolated self-hosted Codegen
on:
  repository_dispatch:
    types: [plasmic]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: plasmic-website-product-www
  cancel-in-progress: false

jobs:
  website-codegen:
    if: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.data.branch == 'product/www' && github.event.client_payload.data.directory == 'app/website' && github.event.client_payload.data.scheme == 'codegen' }}
    runs-on: ubuntu-latest
    env:
      PLASMIC_DEFAULT_HOST: https://plasmic.kompaszbiorek.pl
    steps:
      - name: Mask event payload project API token before third-party actions
        run: |
          node -e 'const p=require(process.env.GITHUB_EVENT_PATH).client_payload?.data?.projectApiToken;if(!p){console.error("Missing Plasmic token in dispatch");process.exit(1)};console.log("::add-mask::"+p)'

      - name: Checkout exact authorized website branch
        uses: actions/checkout@v6
        with:
          ref: product/www
          fetch-depth: 0
          persist-credentials: true

      - name: Detect whether the original workflow has already been fixed by Studio
        id: original
        run: |
          if git show origin/main:.github/actions/plasmic-action/selfhost.cjs >/dev/null 2>&1 \
            || git show origin/main:.github/workflows/plasmic.yml 2>/dev/null | grep -q 'Fix CLI codegen origin selection for self-hosted Studio'; then
            echo 'run_fallback=false' >> "$GITHUB_OUTPUT"
            echo 'Studio generated workflow is patched; skipping duplicate sync.'
          else
            echo 'run_fallback=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node 24
        if: ${{ steps.original.outputs.run_fallback == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm and verify target
        if: ${{ steps.original.outputs.run_fallback == 'true' }}
        run: |
          npm install --global pnpm@9.10.0
          pnpm --version
          test -f app/website/package.json || { echo "::error::Missing website package.json"; exit 1; }
          test "$(git branch --show-current)" = "product/www" || { echo "::error::Wrong branch"; exit 1; }

      - name: Install Plasmic CLI for deterministic self-hosted export
        if: ${{ steps.original.outputs.run_fallback == 'true' }}
        working-directory: app/website
        run: |
          pnpm install --ignore-scripts --ignore-workspace

      - name: Fix CLI codegen origin selection for self-hosted Studio
        if: ${{ steps.original.outputs.run_fallback == 'true' }}
        run: |
          node --input-type=commonjs - <<'NODE'
          const fs = require("fs");
          const file = "app/website/node_modules/@plasmicapp/cli/dist/index.js";
          if (!fs.existsSync(file)) throw new Error("Plasmic CLI binary missing");
          const original = fs.readFileSync(file, "utf8");
          const matcher = /this\.auth\.host\s*===\s*DEFAULT_HOST\d*/g;
          const matches = [...original.matchAll(matcher)];
          if (matches.length !== 1) {
            throw new Error("CLI host routing signature changed: expected exactly one match, got " + matches.length);
          }
          const patched = original.replace(matcher, 'this.auth.host === "https://studio.plasmic.app"');
          fs.writeFileSync(file, patched);
          console.log("Patched CLI to use custom self-hosted API for project resolution.");
          NODE

      - name: Sync Plasmic components from self-hosted Studio
        if: ${{ steps.original.outputs.run_fallback == 'true' }}
        working-directory: app/website
        env:
          PLASMIC_PROJECT_ID: ${{ github.event.client_payload.data.projectId }}
          PLASMIC_PROJECT_API_TOKEN: ${{ github.event.client_payload.data.projectApiToken }}
        run: |
          pnpm --ignore-workspace exec plasmic sync --yes --skip-upgrade-check --projects "$PLASMIC_PROJECT_ID:$PLASMIC_PROJECT_API_TOKEN"

      - name: Commit and push generated site to product/www
        if: ${{ steps.original.outputs.run_fallback == 'true' }}
        run: |
          rm -f app/website/.plasmic.auth
          git add -A -- app/website
          if git diff --cached --name-only | grep -E '(^|/)(\.plasmic\.auth|\.env($|\.))'; then
            echo "::error::Refusing to commit private Plasmic credentials or environment files"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No generated change after Plasmic sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(website): sync Plasmic visual components"
          git push origin HEAD:product/www

      - name: Verify website branch commit is available
        if: ${{ always() && steps.original.outputs.run_fallback == 'true' }}
        run: |
          echo "Target branch: product/www"
          echo "Repository: ${{ github.repository }}"
          git status --short
