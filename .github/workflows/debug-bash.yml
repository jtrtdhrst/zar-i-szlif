name: debug bash
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: print
        run: |
          echo "PATH=$PATH"
          which bash
          ls -l /bin/bash /usr/bin/bash
      - name: node spawn bash
        run: node -e "const {exec}=require('child_process'); exec('echo hi-from-bash', {shell:'bash'}, (e,o,err)=>{console.log('err',e&&e.message); console.log('out',o); console.log('stderr',err);})"
