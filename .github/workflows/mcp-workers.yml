name: MCP Workers

# Każdy MCP jako Cloudflare Worker. Kod jest w repo:
#  - mcp/worker-edge/       — 8 usług na wspólnej krawędzi, każda jako --env
#  - mcp/mantic/worker/     — natywny Worker (Mautic API)
# Wdrożenie: wrangler (token z sekretów środowiska Production).
on:
  push:
    branches: [main, feat/mcp-services-in-repo]
    paths:
      - "mcp/worker-edge/**"
      - "mcp/mantic/worker/**"
      - "mcp/mantic/src/**"
      - ".github/workflows/mcp-workers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-workers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  edge:
    runs-on: ubuntu-latest
    # Token Cloudflare żyje w sekretach środowiska Production (nie w repo).
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build (jedna instalacja dla wszystkich usług)
        working-directory: mcp/worker-edge
        run: npm run build
      - name: Deploy 8 usług krawędzi
        working-directory: mcp/worker-edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c056821a7ee2aabdcf0a6dc447490184
        run: |
          set -e
          for env in emailens langfuse paperclip penpot plasmic qdrant supabase ubuntu; do
            echo "--- deploy $env"
            npx wrangler deploy --env "$env"
          done

  mantic:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build
        working-directory: mcp/mantic/worker
        run: npm run build
      - name: Deploy Worker
        working-directory: mcp/mantic/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c056821a7ee2aabdcf0a6dc447490184
        run: npx wrangler deploy
