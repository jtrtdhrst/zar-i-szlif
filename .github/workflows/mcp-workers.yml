name: MCP Workers

# Jednorazowe / ręczne wdrożenie Workerów MCP z repo (workflow_dispatch).
# Docelowa ścieżka wdrożeń: Cloudflare Workers Builds (repo podpięte w panelu
# Cloudflare), pliki konfiguracji: mcp/worker-edge/wrangler.<usługa>.jsonc
# oraz mcp/mantic/worker/wrangler.jsonc.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-workers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  edge:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build (jedna instalacja dla wszystkich usług)
        working-directory: mcp/worker-edge
        run: npm run build
      - name: Deploy 8 usług krawędzi
        working-directory: mcp/worker-edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c056821a7ee2aabdcf0a6dc447490184
        run: |
          set -e
          for svc in emailens langfuse paperclip penpot plasmic qdrant supabase ubuntu; do
            echo "--- deploy $svc"
            npx wrangler deploy --config "wrangler.$svc.jsonc"
          done

  mantic:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build
        working-directory: mcp/mantic/worker
        run: npm run build
      - name: Deploy Worker
        working-directory: mcp/mantic/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c056821a7ee2aabdcf0a6dc447490184
        run: npx wrangler deploy
