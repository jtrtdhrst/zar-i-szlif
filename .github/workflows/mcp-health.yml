name: MCP Health

# Watchdog publicznych endpointów MCP (Cloudflare Workers).
# Co 15 minut: sprawdza, czy wszystkie endpointy odpowiadają. Jeśli któryś
# nie odpowiada → automatyczny redeploy workerów (self-healing) i ponowna
# weryfikacja. To jest "trwałość": usługi wracają bez udziału człowieka.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mcp/worker-edge/**"
      - "mcp/mantic/worker/**"
      - "scripts/check-mcp-endpoints.mjs"
      - ".github/workflows/mcp-health.yml"

permissions:
  contents: read

concurrency:
  group: mcp-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Token CF jest sekretem środowiska Production (jak w mcp-workers.yml).
    environment: Production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c056821a7ee2aabdcf0a6dc447490184
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sprawdź endpointy MCP
        run: node scripts/check-mcp-endpoints.mjs
      - name: Redeploy workerów (self-healing)
        if: failure()
        run: |
          set -e
          ( cd mcp/mantic/worker && npm run build && npx wrangler deploy ) || true
          ( cd mcp/worker-edge && npm run build )
          for env in emailens langfuse paperclip penpot plasmic qdrant supabase ubuntu; do
            echo "--- redeploy $env"
            ( cd mcp/worker-edge && npx wrangler deploy --env "$env" ) || true
          done
      - name: Ponowna weryfikacja po redeployu
        if: failure()
        run: node scripts/check-mcp-endpoints.mjs
