name: Release Readiness

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-config-preflight:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify required Cloudflare production secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing production secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing production secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          test "${missing}" -eq 0

      - name: Verify Cloudflare production authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.123.0 whoami
