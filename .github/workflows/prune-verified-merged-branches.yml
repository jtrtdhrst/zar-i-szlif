name: One-time safe branch cleanup

# Repository-only housekeeping. No app source, image, release ref or deployment changes.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-verified-merged-branches.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64, zis-local-build]
    timeout-minutes: 10
    steps:
      - name: Delete only verified, already-merged, main-ancestor branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          repo = os.environ["GITHUB_REPOSITORY"]
          assert repo == "miloszspyrka-code/zar-i-szlif"
          assert os.environ["GITHUB_REF"] == "refs/heads/main"
          token = os.environ["GH_TOKEN"]
          root = "/repos/" + repo

          def api(method, path):
              request = Request("https://api.github.com" + path, method=method, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "verified-merged-branch-cleanup",
              })
              try:
                  with urlopen(request, timeout=30) as res:
                      data = res.read()
                      return json.loads(data) if data else None
              except HTTPError as e:
                  if e.code == 404:
                      return None
                  raise RuntimeError(f"{method} {path}: HTTP {e.code}") from e

          def pages(path):
              values = []
              for p in range(1, 30):
                  batch = api("GET", path + ("&" if "?" in path else "?") + f"per_page=100&page={p}")
                  if not isinstance(batch, list):
                      raise RuntimeError(f"Unexpected response on page {p}")
                  values.extend(batch)
                  if len(batch) < 100:
                      return values
              raise RuntimeError("Pagination cap reached; refuse partial cleanup")

          pulls = pages(root + "/pulls?state=all")
          branches = pages(root + "/branches")
          open_names = set()
          merged = set()
          for p in pulls:
              head = p.get("head") or {}
              base = p.get("base") or {}
              name = head.get("ref")
              if p.get("state") == "open":
                  open_names.add(base.get("ref"))
                  if (head.get("repo") or {}).get("full_name") == repo:
                      open_names.add(name)
              elif p.get("merged_at") and (head.get("repo") or {}).get("full_name") == repo:
                  merged.add(name)

          # Coolify still references ZARI-155 even though its PR was merged.
          reserved = {"main", "master", "ci-approved", "ZARI-155"}
          deny_prefix = ("release/", "hold/", "archive/", "production/", "prod/",
                         "staging/", "hotfix/", "deploy/", "operator/")
          deleted, skipped = [], []
          for b in branches:
              name = b["name"]
              if (name in reserved or name in open_names or name not in merged
                      or b.get("protected") or name.startswith(deny_prefix)):
                  skipped.append(name)
                  continue
              encoded = quote(name, safe="/")
              compare = api("GET", root + "/compare/" + encoded + "...main")
              # 0 commits unique to the old branch => tip is already reachable from main.
              if not compare or compare.get("behind_by") != 0:
                  skipped.append(name)
                  continue
              live = api("GET", root + "/branches/" + encoded)
              if not live or live.get("protected") or live["commit"]["sha"] != b["commit"]["sha"]:
                  skipped.append(name)
                  continue
              api("DELETE", root + "/git/refs/heads/" + encoded)
              if api("GET", root + "/branches/" + encoded) is not None:
                  raise RuntimeError(f"Deletion not confirmed: {name}")
              deleted.append(name)
              print("DELETED", name, flush=True)

          print(json.dumps({"repository": repo, "deleted_count": len(deleted),
                            "skipped_count": len(skipped), "deleted": deleted}, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"## Verified branch cleanup\n\nDeleted **{len(deleted)}** of {len(branches)} branches. "
                        "Branches with open PRs, unique commits, protected refs and Coolify dependencies were preserved.\n\n")
              out.writelines("- `" + x + "`\n" for x in deleted)
          PY
