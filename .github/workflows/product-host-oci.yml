name: Product MCP Host OCI

on:
  pull_request:
    branches: [main]
    paths:
      - 'mcp/product-host/**'
      - '.github/workflows/product-host-oci.yml'
  push:
    branches: [main]
    paths:
      - 'mcp/product-host/**'
      - '.github/workflows/product-host-oci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Product MCP host tests and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout untrusted source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/product-host/package-lock.json
      - name: Run actual TypeScript build and tests
        run: |
          set -euo pipefail
          npm ci --prefix mcp/product-host --no-audit --no-fund
          npm --prefix mcp/product-host run check
      - name: Build the owned Dockerfile from its own context
        run: |
          set -euo pipefail
          docker build --pull -f mcp/product-host/Dockerfile -t product-host-verify:${{ github.sha }} mcp/product-host

  publish:
    name: Publish exact-main Product MCP image and digest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout trusted main without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'jtrtdhrst/zar-i-szlif'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Prepare Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate GHCR with scoped GitHub Actions token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish exact source SHA
        id: image
        uses: docker/build-push-action@v6
        with:
          context: mcp/product-host
          file: mcp/product-host/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/zar-i-szlif-product-host:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify immutable OCI digest in publish receipt
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Product MCP host image source: %s\nDigest: %s\n' "$SOURCE_SHA" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
