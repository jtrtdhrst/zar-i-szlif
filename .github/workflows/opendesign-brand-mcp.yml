name: OpenDesign Brand MCP

on:
  push:
    branches: [main, feat/opendesign-brand-mcp]
    paths:
      - "ops/design-stack/**"
      - ".github/workflows/opendesign-brand-mcp.yml"
  pull_request:
    paths:
      - "ops/design-stack/**"
      - ".github/workflows/opendesign-brand-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: opendesign-brand-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ops/design-stack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ops/design-stack/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Upload typecheck diagnostics
        if: failure() && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: opendesign-brand-mcp-typecheck
          path: ops/design-stack/typecheck.log
          retention-days: 1
      - run: npm run lint

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ops/design-stack
          file: ops/design-stack/Dockerfile.mcp
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/miloszspyrka-code/kompas-zbiorek-opendesign-mcp:latest
            ghcr.io/miloszspyrka-code/kompas-zbiorek-opendesign-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
