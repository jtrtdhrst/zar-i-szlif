name: Coolify MCP edge regression
on:
  pull_request:
    paths:
      - 'mcp/worker-edge/**'
      - '.github/workflows/coolify-mcp-edge.yml'
  push:
    branches: [main]
    paths:
      - 'mcp/worker-edge/**'
      - '.github/workflows/coolify-mcp-edge.yml'
jobs:
  edge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify host isolation and default-deny
        run: node --test mcp/worker-edge/test/coolify-routing.test.mjs
      - name: Syntax check the node proxy
        run: node --check mcp/worker-edge/coolify-server.mjs
      - name: Build Coolify candidate
        run: docker build --file mcp/worker-edge/Dockerfile.coolify mcp/worker-edge
      - name: Probe external Coolify ingress ports (diagnostic)
        run: |
          set -euo pipefail
          STAGE=mcp-edge-stage.51.89.174.58.sslip.io
          for proto_port in "http 80" "https 443"; do
            read -r proto port <<< "$proto_port"
            echo "::group::$proto:$port"
            status=$(curl -k --noproxy '*' --show-error --silent --max-time 15 --resolve "$STAGE:$port:51.89.174.58" --output /tmp/mcp-stage-body --dump-header /tmp/mcp-stage-headers --write-out '%{http_code}' "$proto://$STAGE/healthz") || status=connection_error
            printf 'HTTP status: %s\n' "$status"
            cat /tmp/mcp-stage-headers || true
            printf 'Body bytes: '; wc -c < /tmp/mcp-stage-body || true
            head -c 500 /tmp/mcp-stage-body || true
            printf '\n'
            echo "::endgroup::"
          done
