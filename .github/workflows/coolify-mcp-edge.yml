name: Coolify MCP edge regression
on:
  pull_request:
    paths:
      - 'mcp/worker-edge/**'
      - '.github/workflows/coolify-mcp-edge.yml'
  push:
    branches: [main]
    paths:
      - 'mcp/worker-edge/**'
      - '.github/workflows/coolify-mcp-edge.yml'
jobs:
  edge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify host isolation and default-deny
        run: node --test mcp/worker-edge/test/coolify-routing.test.mjs
      - name: Syntax check the node proxy
        run: node --check mcp/worker-edge/coolify-server.mjs
      - name: Build Coolify candidate
        run: docker build --file mcp/worker-edge/Dockerfile.coolify mcp/worker-edge
      - name: Live Cloudflare Tunnel to Coolify edge E2E
        run: |
          set -euo pipefail
          BASE=https://mcp-edge-stage.zariszlif.pl
          for path in healthz health; do
            status=$(curl --noproxy '*' --show-error --silent --retry 3 --retry-delay 2 --max-time 15 -o /tmp/mcp-stage-body -D /tmp/mcp-stage-headers -w '%{http_code}' "$BASE/$path")
            echo "GET /$path: $status"
            cat /tmp/mcp-stage-headers | grep -iE '^(HTTP/|server:|content-type:)' || true
            head -c 500 /tmp/mcp-stage-body
            echo
            test "$status" = "200"
            if [ "$path" = "healthz" ]; then grep -F '"ok":true' /tmp/mcp-stage-body; fi
            if [ "$path" = "health" ]; then grep -F '"paperclip-mcp-coolify:3101"' /tmp/mcp-stage-body; fi
          done
          status=$(curl --noproxy '*' --show-error --silent --max-time 15 -o /tmp/mcp-stage-body -w '%{http_code}' -H 'Content-Type: application/json' -X POST --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' "$BASE/mcp")
          echo "Unauthorized MCP tools/list status: $status"
          test "$status" = "401"
          for path in /.well-known/oauth-authorization-server /.well-known/oauth-protected-resource; do
            status=$(curl --noproxy '*' --show-error --silent --max-time 15 -o /tmp/mcp-stage-oauth -D /tmp/mcp-stage-oauth-headers -w '%{http_code}' "$BASE$path")
            echo "OAuth discovery $path HTTP $status"
            head -c 450 /tmp/mcp-stage-oauth
            echo
            test "$status" = "200"
            grep -F "mcp-edge-stage.zariszlif.pl" /tmp/mcp-stage-oauth
          done
      - name: Paperclip production-host canary — OAuth and auth denial
        run: |
          set -euo pipefail
          BASE=https://paperclip-mcp-canary.zariszlif.pl
          for path in /health /.well-known/oauth-authorization-server; do
            code=$(curl --noproxy '*' --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 --max-time 15 -o /tmp/pc-candidate -w '%{http_code}' "$BASE$path")
            echo "Paperclip canary $path HTTP $code"
            head -c 500 /tmp/pc-candidate
            echo
            test "$code" = "200"
            if [ "$path" = "/health" ]; then
              grep -F '"service":"paperclip-mcp"' /tmp/pc-candidate
            elif [ "$path" = "/.well-known/oauth-authorization-server" ]; then
              grep -F '"issuer":"https://paperclip-mcp-canary.zariszlif.pl"' /tmp/pc-candidate
            fi
          done
          code=$(curl --noproxy '*' --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --max-time 15 -o /tmp/pc-candidate -w '%{http_code}' -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":7,"method":"tools/list"}' "$BASE/mcp")
          echo "Paperclip canary unauthorized tools/list HTTP $code"
          test "$code" = "401"
      - name: Verify deployed Coolify image matches merged source (main only)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          expected=$(node -e 'const {createHash}=require("node:crypto"); const {readFileSync}=require("node:fs"); const files=["mcp/worker-edge/coolify-server.mjs","mcp/worker-edge/coolify-routing.mjs","mcp/worker-edge/src/index.ts"]; console.log(createHash("sha256").update(files.map(p=>readFileSync(p,"utf8")).join("\n--mcp-edge--\n")).digest("hex"))')
          echo "Merged source fingerprint: $expected"
          for attempt in $(seq 1 36); do
            actual=$(curl --noproxy '*' --silent --show-error --max-time 10 https://mcp-edge-stage.zariszlif.pl/healthz | node -e 'let s="";process.stdin.on("data", d=>s+=d).on("end",()=>{try { process.stdout.write(JSON.parse(s).artifactSha256 || "") } catch {} })') || actual=""
            if [ "$actual" = "$expected" ]; then
              echo "PASS: deployed source fingerprint matches merged main: $actual"
              exit 0
            fi
            echo "Waiting for Coolify artifact readback ($attempt/36); running=$actual"
            sleep 10
          done
          echo "FAIL: running Coolify image does not match merged main source"
          exit 1
      - name: ComfyUI production after Cloudflare Worker removal — MCP E2E
        run: |
          set -euo pipefail
          BASE=https://mcp-comfy.kompaszbiorek.pl
          status=$(curl --noproxy '*' --silent --show-error --retry-all-errors --retry 6 --retry-delay 3 --max-time 15 -o /tmp/comfy-prod -w '%{http_code}' "$BASE/health")
          echo "ComfyUI production health HTTP $status"
          head -c 450 /tmp/comfy-prod; echo
          test "$status" = "200"
          grep -F 'comfy-engine.zariszlif.pl' /tmp/comfy-prod
          status=$(curl --noproxy '*' --silent --show-error --retry-all-errors --retry 4 --retry-delay 2 --max-time 30 -D /tmp/comfy-prod-headers -o /tmp/comfy-prod -w '%{http_code}' -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"coolify-production-e2e","version":"1"}}}' "$BASE/mcp")
          echo "ComfyUI production initialize HTTP $status"
          head -c 700 /tmp/comfy-prod; echo
          test "$status" = "200"
          grep -E '"serverInfo"|"protocolVersion"' /tmp/comfy-prod
          sid=$(awk 'BEGIN{IGNORECASE=1} tolower($1)=="mcp-session-id:" {gsub("\r","",$2); print $2}' /tmp/comfy-prod-headers | tail -1)
          args=(-H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream')
          if [ -n "$sid" ]; then args+=(-H "mcp-session-id: $sid"); fi
          status=$(curl --noproxy '*' --silent --show-error --retry-all-errors --retry 4 --retry-delay 2 --max-time 30 -o /tmp/comfy-prod -w '%{http_code}' "${args[@]}" --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' "$BASE/mcp")
          echo "ComfyUI production tools/list HTTP $status"
          head -c 900 /tmp/comfy-prod; echo
          test "$status" = "200"
          grep -E '"tools"|"result"' /tmp/comfy-prod
