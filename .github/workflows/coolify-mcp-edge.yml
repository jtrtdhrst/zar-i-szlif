name: Coolify MCP edge regression
on:
  pull_request:
    paths:
      - 'mcp/worker-edge/**'
      - '.github/workflows/coolify-mcp-edge.yml'
  push:
    branches: [main]
    paths:
      - 'mcp/worker-edge/**'
      - '.github/workflows/coolify-mcp-edge.yml'
jobs:
  edge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify host isolation and default-deny
        run: node --test mcp/worker-edge/test/coolify-routing.test.mjs
      - name: Syntax check the node proxy
        run: node --check mcp/worker-edge/coolify-server.mjs
      - name: Build Coolify candidate
        run: docker build --file mcp/worker-edge/Dockerfile.coolify mcp/worker-edge
      - name: External staging readback (Coolify HTTP reverse proxy)
        run: |
          set -euo pipefail
          STAGE=mcp-edge-stage.51.89.174.58.sslip.io
          for path in healthz health; do
            echo "::group::Probe $path"
            status=$(curl --noproxy '*' --show-error --silent --max-time 15 --resolve "$STAGE:80:51.89.174.58" --output /tmp/mcp-stage-body --dump-header /tmp/mcp-stage-headers --write-out '%{http_code}' "http://$STAGE/$path")
            printf 'HTTP status: %s\n' "$status"
            cat /tmp/mcp-stage-headers
            printf 'Body bytes: '; wc -c < /tmp/mcp-stage-body
            head -c 800 /tmp/mcp-stage-body; printf '\n'
            if [ "$status" != "200" ]; then exit 1; fi
            if [ "$path" = "healthz" ]; then grep -F '"ok":true' /tmp/mcp-stage-body; fi
            if [ "$path" = "health" ]; then grep -F '"paperclip-engine.zariszlif.pl"' /tmp/mcp-stage-body; fi
            echo "::endgroup::"
          done
