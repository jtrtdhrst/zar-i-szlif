name: Product hosted source fixtures
# Supplemental isolated PR checks only. Trusted main CI and independent release
# approval remain mandatory; this job cannot publish or promote anything.
on:
  pull_request:
    branches: [main]
    paths:
      - 'mcp/product-host/**'
      - 'app/web/**'
      - 'ops/mascot-worker/**'
      - 'ops/service-build-roots.json'
      - 'tests/service-source-roots.test.mjs'
      - '.github/workflows/product-hosted-source-fixtures.yml'
permissions:
  contents: read
jobs:
  product-host-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate declared service roots
        run: node --test tests/service-source-roots.test.mjs
      - name: Install Product MCP locked dependencies without lifecycle scripts
        working-directory: mcp/product-host
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Product MCP typecheck, build and fixture suite
        working-directory: mcp/product-host
        run: npm run check
