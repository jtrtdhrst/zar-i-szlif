# Penpot MCP stack: native (upstream image) + headless (built) + router (built).
#
# Secrets live in ./secrets/ (gitignored):
#   secrets/access-token — Penpot user access token (headless)
#   secrets/mcp-token    — MCP auth token used by the router (forwarded as ?userToken=)
name: penpot-mcp

services:
  penpot-native:
    image: penpotapp/mcp:2.18.3
    command: ["node", "index.js", "--multi-user"]
    environment:
      PENPOT_MCP_SERVER_HOST: "0.0.0.0"
    expose:
      - "4401"
    restart: unless-stopped

  penpot-headless:
    build: ./headless
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: "3000"
      PENPOT_BASE_URL: ${PENPOT_BASE_URL:-http://penpot-frontend:8080}
      PENPOT_ACCESS_TOKEN_FILE: /run/secrets/access-token
      PENPOT_TOKENS_PATH: /app/tokens.json
    volumes:
      - ./secrets/access-token:/run/secrets/access-token:ro
    expose:
      - "3000"
    restart: unless-stopped

  penpot-router:
    build: ./router
    environment:
      PORT: "3001"
      NATIVE_MCP_URL: http://penpot-native:4401/mcp
      HEADLESS_MCP_URL: http://penpot-headless:3000/mcp
      MCP_TOKEN_FILE: /run/secrets/mcp-token
    volumes:
      - ./secrets/mcp-token:/run/secrets/mcp-token:ro
    ports:
      - "3001:3001"
    depends_on:
      - penpot-native
      - penpot-headless
    restart: unless-stopped
