location = /mcp/stream {
    access_log off;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_buffering off;
    proxy_pass http://penpot-mcp-router:3001/mcp$is_args$args;
    proxy_http_version 1.1;
}

# Some MCP clients normalize the endpoint with a trailing slash.
location = /mcp/stream/ {
    access_log off;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_buffering off;
    proxy_pass http://penpot-mcp-router:3001/mcp$is_args$args;
    proxy_http_version 1.1;
}
