# Penpot SPA deep links (2026-10-19).
# Findings (verified at runtime with a real browser):
# - This build (2.18.3-1791289595) uses HASH routing (goog.history useFragment).
#   Canonical share/bookmark URL:  /#/workspace/<project>/<file>
#   (also #/view/<file>, #/dashboard/team/<team>). The route path lives in
#   the fragment; the server only ever needs to serve / for those.
# - The base image ships a catch-all inside `location /`:
#     location ~ ^/[^/]+/(.*)$ { return 301 " /404"; }
#   which 301-redirected EVERY two-segment path to /404 — including the real
#   frontend routes. Result: refresh/bookmark of a file threw users to /404.
# - index.html references assets RELATIVELY (js/main.js, css/…, no <base>),
#   so a deep path that serves index.html would resolve assets against the
#   deep URL. The first location below strips the route prefix for known
#   static dirs; path-style deep links 302-redirect to their hash equivalent,
#   the only form the app boots from (blank shell otherwise).
# Nginx gotchas encoded here (both hit during testing):
# - a `rewrite` (even non-matching) clobbers $1..$9, so the asset rewrite and
#   the redirect live in SEPARATE locations; asset location first.
# - nginx absolutizes relative Location: using request Host/scheme, which
#   leaks the internal origin (http://penpot-frontend:8080) and a wrong port
#   through Cloudflare; hence the absolute https://$host target ($host has
#   no port; public access is always https via Cloudflare).
# This drop-in is included (location.d/*.conf) BEFORE the catch-all rule,
# and regex locations win by first match. Upstream-supported mechanism.
# NOTE: lives inside the container fs — re-apply after frontend recreate:
#   docker cp frontend-spa-deep-links.conf penpot-penpot-frontend-1:/etc/nginx/overrides/location.d/spa-deep-links.conf
#   docker exec penpot-penpot-frontend-1 nginx -s reload
# Durable fix: bind-mount this file in the host compose (/opt/penpot):
#   volumes:
#     - /home/opencode/projects/penpot-mcp-router/frontend-spa-deep-links.conf:/etc/nginx/overrides/location.d/spa-deep-links.conf:ro
location ~ ^/(?:workspace|view|dashboard|render-sprite)/.+/(js|css|images|fonts|plugins|wasm-playground)/(.+)$ {
    include /etc/nginx/nginx-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, max-age=0" always;
    rewrite ^/(?:workspace|view|dashboard|render-sprite)/.+/(js|css|images|fonts|plugins|wasm-playground)/(.+)$ /$1/$2 break;
    try_files $uri =404;
}
location ~ ^/(workspace|view|dashboard|render-sprite)(/.*)?$ {
    include /etc/nginx/nginx-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, max-age=0" always;
    # Quoted: otherwise nginx would treat # as a comment starter.
    return 302 "https://$host/#/$1$2$is_args$args";
}
