name: plasmic-mcp
services:
  plasmic-mcp:
    image: ghcr.io/miloszspyrka-code/zar-i-szlif-plasmic-mcp:${IMAGE_TAG:?IMAGE_TAG required: approved SHA from main}
    pull_policy: always
    command: ["node", "services/plasmic-mcp/server.ts"]
    environment:
      PLASMIC_BASE_URL: ${PLASMIC_BASE_URL:?PLASMIC_BASE_URL required}
      PLASMIC_EMAIL: ${PLASMIC_EMAIL:?PLASMIC_EMAIL required}
      PLASMIC_PASSWORD: ${PLASMIC_PASSWORD:?PLASMIC_PASSWORD required}
      PLASMIC_STATE_DIR: /state
      MCP_HTTP_PORT: "8091"
      MCP_AUTH_TOKEN: ${PLASMIC_MCP_TOKEN:?PLASMIC_MCP_TOKEN required}
      PAPERCLIP_AGENT_ID: ${PAPERCLIP_AGENT_ID:-}
      PAPERCLIP_RUN_ID: ${PAPERCLIP_RUN_ID:-}
    networks: [plasmic_default]
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 64
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - plasmic_mcp_state:/state
    logging: { driver: local, options: { max-size: 10m, max-file: "3" } }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
networks:
  plasmic_default: { external: true }
volumes:
  plasmic_mcp_state:
