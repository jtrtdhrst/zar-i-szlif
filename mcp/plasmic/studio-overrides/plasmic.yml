# Plasmic workflow v4
name: Sync, build and deploy Plasmic app

permissions:
  contents: write
  pull-requests: write

on:
  repository_dispatch:
    types: [plasmic]

jobs:
  job:
    name: Sync, build and deploy
    runs-on: ubuntu-latest
    env:
      PLASMIC_DEFAULT_HOST: https://plasmic.kompaszbiorek.pl
      IS_WEBSITE: ${{ github.event.client_payload.data.branch == 'product/www' && github.event.client_payload.data.directory == 'app/website' && github.event.client_payload.data.scheme == 'codegen' }}
    steps:
      - id: checkout
        name: Checking out repository...
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.client_payload.data.branch }}
      - id: node
        name: Setting up node v24...
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - id: pnpm
        name: Installing pnpm for Plasmic CLI
        run: npm install --global pnpm@12
      - id: mask
        name: Mask Plasmic project API token before actions
        run: |
          node -e 'const p=require(process.env.GITHUB_EVENT_PATH).client_payload?.data?.projectApiToken;if(!p){console.error("Missing Plasmic token");process.exit(1)};console.log("::add-mask::"+p)'
      - id: cache
        name: Recovering cache...
        uses: actions/cache@v5
        with:
          key: lock-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}
          path: ${{ github.event.client_payload.data.directory }}/node_modules
      - id: verify
        name: Verify selected branch and website directory
        if: ${{ env.IS_WEBSITE == 'true' }}
        env:
          PLASMIC_BRANCH: ${{ github.event.client_payload.data.branch }}
          PLASMIC_DIRECTORY: ${{ github.event.client_payload.data.directory }}
        run: |
          test "$(git branch --show-current)" = "$PLASMIC_BRANCH" || { echo "::error::Wrong publish branch"; exit 1; }
          test -f "$PLASMIC_DIRECTORY/package.json" || { echo "::error::Directory lacks package.json"; exit 1; }
      - name: Prepare website CLI for self-hosted Codegen
        if: ${{ env.IS_WEBSITE == 'true' }}
        working-directory: app/website
        run: |
          pnpm install --ignore-scripts
          pnpm add --ignore-scripts @plasmicapp/react-web
          pnpm add -D --ignore-scripts @plasmicapp/cli@0.1.381

      - name: Fix CLI codegen origin selection for self-hosted Studio
        if: ${{ env.IS_WEBSITE == 'true' }}
        run: |
          node --input-type=commonjs - <<'NODE'
          const fs=require("fs");
          const file="app/website/node_modules/@plasmicapp/cli/dist/index.js";
          if (!fs.existsSync(file)) throw new Error("Missing Plasmic CLI");
          const contents=fs.readFileSync(file,"utf8");
          const re=/this\.auth\.host\s*===\s*DEFAULT_HOST\d*/g;
          const matches=[...contents.matchAll(re)];
          if(matches.length!==1)throw new Error("CLI host routing signature changed: "+matches.length);
          fs.writeFileSync(file,contents.replace(re,'this.auth.host === "https://studio.plasmic.app"'));
          console.log("Self-hosted CLI codegen endpoint corrected.");
          NODE

      - name: Generate website from self-hosted Plasmic
        if: ${{ env.IS_WEBSITE == 'true' }}
        working-directory: app/website
        env:
          PLASMIC_PROJECT_ID: ${{ github.event.client_payload.data.projectId }}
          PLASMIC_PROJECT_API_TOKEN: ${{ github.event.client_payload.data.projectApiToken }}
        run: |
          pnpm exec plasmic sync --yes --projects "$PLASMIC_PROJECT_ID:$PLASMIC_PROJECT_API_TOKEN"

      - name: Commit website Codegen changes only
        if: ${{ env.IS_WEBSITE == 'true' }}
        run: |
          rm -f app/website/.plasmic.auth
          git add -A -- app/website
          if git diff --cached --name-only | grep -E '(^|/)(\.plasmic\.auth|\.env($|\.))'; then
            echo "::error::Private configuration is staged"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Plasmic website was already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(website): sync Plasmic visual components"
          git push origin HEAD:product/www

      - id: init
        name: Initializing Plasmic app...
        if: ${{ env.IS_WEBSITE != 'true' }}
        uses: plasmicapp/plasmic-action@master
        with:
          run: init
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.event.client_payload.data.branch }}
          directory: ${{ github.event.client_payload.data.directory }}
          project_id: ${{ github.event.client_payload.data.projectId }}
          project_api_token: ${{ github.event.client_payload.data.projectApiToken }}
          platform: ${{ github.event.client_payload.data.platform }}
          language: ${{ github.event.client_payload.data.language }}
          scheme: ${{ github.event.client_payload.data.scheme }}
          title: ${{ github.event.client_payload.data.title }}
          description: ${{ github.event.client_payload.data.description }}
      - id: sync
        name: Syncing Plasmic project...
        if: ${{ env.IS_WEBSITE != 'true' && github.event.client_payload.data.scheme == 'codegen' && steps.init.outputs.synced != 'true' }}
        uses: plasmicapp/plasmic-action@master
        with:
          run: sync
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.event.client_payload.data.branch }}
          directory: ${{ github.event.client_payload.data.directory }}
          project_id: ${{ github.event.client_payload.data.projectId }}
          project_api_token: ${{ github.event.client_payload.data.projectApiToken }}
          sync_action: ${{ github.event.client_payload.data.syncAction }}
          title: ${{ github.event.client_payload.data.title }}
          description: ${{ github.event.client_payload.data.description }}
      - id: build
        name: Building Plasmic app...
        if: ${{ env.IS_WEBSITE != 'true' && github.event.client_payload.data.publish }}
        uses: plasmicapp/plasmic-action@master
        with:
          run: build
          branch: ${{ github.event.client_payload.data.branch }}
          directory: ${{ github.event.client_payload.data.directory }}
          platform: ${{ github.event.client_payload.data.platform }}
      - id: pr
        name: Creating pull request...
        if: ${{ env.IS_WEBSITE != 'true' && steps.sync.outputs.new_branch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD: ${{ steps.sync.outputs.new_branch }}
          PR_BASE: ${{ github.event.client_payload.data.branch }}
          PR_TITLE: ${{ github.event.client_payload.data.title }}
          PR_BODY: ${{ github.event.client_payload.data.description }}
        run: |
          existing=$(gh pr list --head "$PR_HEAD" --base "$PR_BASE" --state open --json number --jq '.[].number')
          if [ -z "$existing" ]; then
            gh pr create \
              --head "$PR_HEAD" \
              --base "$PR_BASE" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          else
            echo "PR already exists for $PR_HEAD -> $PR_BASE (#$existing); skipping create."
          fi
