services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  mcp-server:
    build: ./server
    env_file: .env
    environment:
      # Local Qdrant wins over whatever QDRANT_URL is in .env (e.g. Cloud).
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      MCP_TRANSPORT: streamable-http
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

volumes:
  qdrant_data:
