services:
  emailens:
    build:
      context: ./emailens-mcp
    environment:
      EMAILENS_BRIDGE_TOKEN: ${EMAILENS_BRIDGE_TOKEN}
      PORT: "3100"
      MCP_PATH: /mcp
      IDLE_SECONDS: "600"
    networks:
      coolify:
        aliases:
          - emailens-mcp-bridge-staging
    restart: unless-stopped

  mantic:
    build:
      context: ./mantic-mcp
      dockerfile: Dockerfile.http
    environment:
      BRIDGE_PORT: "8090"
      BRIDGE_TOKEN: ${MANTIC_BRIDGE_TOKEN:-}
      MAUTIC_BASE_URL: ${MAUTIC_BASE_URL}
      MAUTIC_CLIENT_ID: ${MAUTIC_CLIENT_ID}
      MAUTIC_CLIENT_SECRET: ${MAUTIC_CLIENT_SECRET}
      MAUTIC_TOKEN_ENDPOINT: ${MAUTIC_TOKEN_ENDPOINT}
    networks:
      coolify:
        aliases:
          - mantic-mcp-http
    restart: unless-stopped

  ubuntu:
    build:
      context: ./ubuntu-mcp
    environment:
      BRIDGE_PORT: "8765"
      BRIDGE_TOKEN_FILE: /bridge-config/bridge-bearer-token
      BRIDGE_CHILD_ARGS: /opt/node_modules/mcp-ssh-manager/src/index.js
      BRIDGE_AUDIT_FILE: /audit/ubuntu-mcp-audit.jsonl
      SSH_MANAGER_KNOWN_HOSTS: /bridge-config/known_hosts
      SSH_SERVER_UBUNTU_HOST: ${SSH_SERVER_UBUNTU_HOST:-51.89.174.58}
      SSH_SERVER_UBUNTU_PORT: ${SSH_SERVER_UBUNTU_PORT:-22}
      SSH_SERVER_UBUNTU_USER: ${SSH_SERVER_UBUNTU_USER:-harness-ops}
      SSH_SERVER_UBUNTU_KEYPATH: ${SSH_SERVER_UBUNTU_KEYPATH:-/bridge-config/harness-ops}
      SSH_SERVER_UBUNTU_MODE: ${SSH_SERVER_UBUNTU_MODE:-ssh}
      SSH_SERVER_UBUNTU_AUDIT_LOG: ${SSH_SERVER_UBUNTU_AUDIT_LOG:-/audit/ssh-audit.jsonl}
      SSH_LOG_LEVEL: ${SSH_LOG_LEVEL:-info}
    volumes:
      - /home/opencode/server/config/ubuntu-mcp:/bridge-config:ro
      - ubuntu-mcp-audit:/audit
    networks:
      coolify:
        aliases:
          - ubuntu-mcp-bridge-lkzpdbpxyg1fn8m0uz2aocom
    restart: unless-stopped

networks:
  coolify:
    external: true

volumes:
  ubuntu-mcp-audit:
